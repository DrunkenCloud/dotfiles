[window]
opacity = 0.85
startup_mode = "Maximized"
# "Full" = title bar + border, "None" = neither
decorations = "Full"

[env]
WINIT_UNIX_BACKEND = "wayland"

[font]
size = 17.5

# TokyoNight Alacritty Colors
# Default colors
[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'

# Added: Cursor configuration for a Block cursor
[cursor]
style = { shape = "Beam", blinking = "On" }
# You can uncomment the colors.cursor block if you want the cursor colors to be different
#[colors.cursor]
#cursor = '#c0caf5'
#text = '#1a1b26'

# Normal colors
[colors.normal]
black = '#15161e'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#a9b1d6'

# Bright colors
[colors.bright]
black = '#414868'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#c0caf5'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#ff9e64'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
