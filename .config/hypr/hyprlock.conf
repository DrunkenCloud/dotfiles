# hyprlock: the lock screen. Matches the purple waybar / Yaru-magenta theme.

general {
    hide_cursor        = true
    ignore_empty_input = true    # pressing Enter on an empty box doesn't count as a failed try
}

# Blurred, darkened wallpaper
background {
    monitor     =
    path        = ~/.config/hypr/ai_star.png
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.55
    vibrancy    = 0.2
}

# Big clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(e9d5ff)
    font_size   = 110
    font_family = Ubuntu Sans Bold
    position    = 0, 190
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(e9d5ffcc)
    font_size   = 22
    font_family = Ubuntu Sans
    position    = 0, 90
    halign      = center
    valign      = center
}

# Password box
input-field {
    monitor           =
    size              = 320, 56
    rounding          = 16
    outline_thickness = 2
    outer_color       = rgb(a855f7)
    inner_color       = rgba(14121ccc)
    font_color        = rgb(e9d5ff)
    font_family       = Ubuntu Sans
    check_color       = rgb(c084fc)        # border while checking the password
    fail_color        = rgb(ed8796)        # border after a wrong password
    capslock_color    = rgb(eed49f)
    dots_size         = 0.25
    dots_spacing      = 0.35
    fade_on_empty     = false
    placeholder_text  = <span foreground="##9a9a9a">Password</span>
    fail_text         = <i>Wrong password ($ATTEMPTS)</i>
    position          = 0, -60
    halign            = center
    valign            = center
}

# Greeting
label {
    monitor     =
    text        = Hi, $USER
    color       = rgba(e9d5ff99)
    font_size   = 14
    font_family = Ubuntu Sans
    position    = 0, -125
    halign      = center
    valign      = center
}
