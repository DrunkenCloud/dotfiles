# hypridle: what happens when you stop using the laptop.
# Timeouts are seconds of no keyboard/mouse input. Change them freely.
# (Hyprland itself uses Lua now, but hypridle still reads this .conf format.)

$lock      = pidof hyprlock || hyprlock          # never start a second lock screen
$screenOff = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
$screenOn  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

general {
    lock_cmd         = $lock                     # run on `loginctl lock-session`
    before_sleep_cmd = loginctl lock-session     # lock before suspend (lid close too)
    after_sleep_cmd  = $screenOn                 # don't wake up to a black screen
    ignore_dbus_inhibit = false                  # videos/calls in browsers prevent idling
}

# 2.5 min: dim the screen as a warning
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%        # -s saves the current brightness
    on-resume  = brightnessctl -r                # -r restores it
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: turn the screen off (it stays locked)
listener {
    timeout    = 330
    on-timeout = $screenOff
    on-resume  = $screenOn
}

# 30 min: suspend. Delete this block if you don't want the laptop to sleep.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
